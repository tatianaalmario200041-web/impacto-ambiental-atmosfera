<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impacto Ambiental Atmósfera - Trivia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 32, 39, 0.8), rgba(32, 58, 67, 0.8)), 
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #00ffff;
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .autores {
            color: #ffeb3b;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 32, 39, 0.85);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(0, 255, 255, 0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .cell {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .cell.active {
            background: #00ffff;
            color: #0f2027;
            box-shadow: 0 0 15px #00ffff;
            transform: scale(1.05);
        }
        .controls {
            text-align: center;
            width: 100%;
        }
        button {
            background-color: #00ffff;
            color: #0f2027;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,255,0.4);
            transition: background 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #00b3b3;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e3c72;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            text-align: center;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        .modal-content h3 {
            color: #00ffff;
            margin-top: 0;
        }
        .turno-info {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00ffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>IMPACTO AMBIENTAL ATMÓSFERA</h1>
        <div class="autores">Facultad de Procesos | Tatiana Almario y Tania Rodríguez</div>
    </header>

    <div class="container">
        <div class="turno-info" id="turnoText">Turno: Grupo 1</div>
        
        <!-- Tablero de 10 casillas -->
        <div class="board" id="board"></div>

        <div class="controls">
            <button onclick="lanzarDado()">Lanzar Dado 🎲</button>
            <p id="resultadoDado" style="margin-top: 10px; font-size: 1.1rem;"></p>
        </div>
    </div>

    <!-- Ventana emergente para Preguntas y Comodines -->
    <div class="modal" id="modalPregunta">
        <div class="modal-content">
            <h3 id="modalTitulo">Casilla Especial</h3>
            <p id="modalTexto" style="font-size: 1.1rem; margin: 20px 0; line-height: 1.5;"></p>
            <button onclick="cerrarModal()">¡Continuar Juego!</button>
        </div>
    </div>

    <script>
        const totalCasillas = 10;
        let posicionActual = 0;
        let grupoActual = 1;

        const eventosCasillas = {
            1: "Pregunta Técnica (Grupo 1): ¿Cuál es la capa inferior de la atmósfera donde se concentra la mayor masa de aire y ocurren los fenómenos meteorológicos? (Respuesta: La tropósfera)",
            2: "¡Comodín! Ganas una carta de 'Cambio de Pregunta' para usarla más adelante si la necesitas.",
            3: "Pregunta Técnica (Grupo 2): ¿Qué fenómeno climático (como la ZCIT) y relieve limitan la ventilación natural en los valles como la Sabana de Bogotá? (Respuesta: El relieve andino y cuencas cerradas)",
            4: "¡Impulso Ambiental! Avanzas 1 casilla extra por mencionar una buena práctica industrial.",
            5: "Pregunta Técnica (Grupo 3): Mencione las tres clasificaciones de fuentes de contaminación exigidas por la norma. (Respuesta: Fijas, móviles y naturales)",
            6: "¡Comodín! Tienes derecho a pasarle una pregunta difícil a otro grupo.",
            7: "Pregunta Técnica (Grupo 4): ¿Por qué el material particulado PM2.5 es el más peligroso para la salud? (Respuesta: Por su tamaño fino que penetra profundo en las vías respiratorias)",
            8: "¡Zona de Inversión Térmica! No pasa nada, respira hondo y continúa en el siguiente turno.",
            9: "Pregunta Técnica (Grupo 5): ¿Qué diferencia hay entre la Resolución 909 y la Resolución 2254? (Respuesta: La 909 regula chimeneas/fuentes fijas y la 2254 la calidad del aire ambiente)",
            10: "🎉 ¡LLEGASTE A LA CIMA! Grupo con nota máxima de participación asegurada 5.0."
        };

        function crearTablero() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 1; i <= totalCasillas; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.innerText = i === 10 ? '🏁 Meta' : i;
                if (i === posicionActual) {
                    cell.classList.add('active');
                }
                board.appendChild(cell);
            }
        }

        function lanzar() {
            return Math.floor(Math.random() * 2) + 1; // Avanza de 1 a 2 pasos para que sea ágil
        }

        function lanzarDado() {
            const avance = lanzar();
            posicionActual += avance;
            if (posicionActual > totalCasillas) {
                posicionActual = totalCasillas;
            }

            crearTablero();
            document.getElementById('resultadoDado').innerText = `El Grupo ${grupoActual} avanzó: +${avance} casilla(s).`;

            setTimeout(() => {
                mostrarModal(posicionActual);
            }, 400);
        }

        function mostrarModal(casilla) {
            const modal = document.getElementById('modalPregunta');
            const titulo = document.getElementById('modalTitulo');
            const texto = document.getElementById('modalTexto');

            titulo.innerText = `Casilla ${casilla} - Turno Grupo ${grupoActual}`;
            texto.innerText = eventosCasillas[casilla] || "¡Casilla libre!";
            modal.style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalPregunta').style.display = 'none';
            
            grupoActual++;
            if (grupoActual > 5) {
                grupoActual = 1;
            }
            document.getElementById('turnoText').innerText = `Turno: Grupo ${grupoActual}`;
            
            if (posicionActual >= totalCasillas) {
                alert(`¡El Grupo ha llegado a la meta de la Escalera del Aire!`);
                posicionActual = 0;
                crearTablero();
            }
        }

        crearTablero();
    </script>
</body>
</html>
